<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:form action="create" name="item" object="{item}" enctype="multipart/form-data">
    <f:form.textfield property="title"/>
    <f:form.upload property="images" multiple="1"/>
    <f:form.checkbox name="item[images][rights]" value="1"/>
    <f:form.submit value="Save"/>
</f:form>
</html>
